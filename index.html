<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HAF Monitor Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/684/684908.png">

    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
    
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100%; width: 100%; position: fixed; }
        
        /* PANTALLA DE LOGIN */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .login-box {
            background: rgba(0, 20, 0, 0.92); padding: 30px;
            border: 2px solid #0f0; border-radius: 15px;
            box-shadow: 0 0 20px #0f0; text-align: center; width: 280px;
        }
        .login-box h2 { margin-bottom: 20px; text-shadow: 0 0 5px #0f0; }
        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #111; border: 1px solid #0f0; color: #fff;
            border-radius: 5px; box-sizing: border-box; outline: none;
        }
        .btn-login {
            width: 100%; padding: 12px; background: #0f0; color: #000;
            border: none; border-radius: 5px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; margin-top: 10px;
        }

        /* CONTENIDO PRINCIPAL */
        #main-content { display: none; }
        #map { height: 100vh; height: 100dvh; width: 100%; position: absolute; }
        
        #panel { 
            position: fixed; top: 15px; left: 15px; z-index: 1000; 
            background: rgba(0, 0, 0, 0.92); padding: 20px; 
            border: 1px solid #0f0; border-radius: 12px; 
            width: 280px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.4);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* BOTÓN ACTUALIZAR FLOTANTE */
        #btn-refresh {
            position: fixed; top: 15px; right: 15px; z-index: 1001;
            background: rgba(0, 0, 0, 0.8); color: #0f0;
            border: 1px solid #0f0; border-radius: 50%;
            width: 45px; height: 45px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            font-size: 20px; transition: 0.3s;
        }
        #btn-refresh:active { transform: rotate(180deg) scale(0.9); }

        .handle {
            width: 50px; height: 6px; background: #0f0; border-radius: 3px;
            margin: -5px auto 15px auto; cursor: pointer; display: none;
            box-shadow: 0 0 8px #0f0;
        }

        @media (max-width: 600px) {
            #panel {
                top: auto; bottom: 0; left: 0; width: 100%; 
                max-height: 50vh; border-radius: 20px 20px 0 0;
                padding: 15px; border: 1px solid #0f0; border-bottom: none;
                box-sizing: border-box; padding-bottom: 30px;
            }
            .handle { display: block; }
            #panel.minimized { transform: translateY(calc(100% - 60px)); }
            #lista-dispositivos { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; }
            .dispositivo-card { min-width: 180px; margin-bottom: 0 !important; flex-shrink: 0; }
            #btn-refresh { top: 10px; right: 10px; width: 40px; height: 40px; }
        }

        .dispositivo-card {
            background: #111; border: 1px solid #333;
            padding: 12px; margin-bottom: 10px; border-radius: 8px;
            font-size: 13px; cursor: pointer; transition: 0.3s;
        }
        .dispositivo-card.selected { border-left: 5px solid #0f0; background: #222; border-color: #0f0; }
        
        h3 { margin: 0 0 15px 0; text-align: center; color: #0f0; text-shadow: 0 0 5px #0f0; font-size: 18px; }
        input[type="date"] { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 10px; margin: 10px 0; border-radius: 6px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; margin-top: 5px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; text-transform: uppercase; }
        .btn-historial { background: #0f0; color: #000; }
        .btn-vivo { background: #333; color: #fff; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>HAF SECURITY</h2>
            <input type="text" id="userInput" placeholder="USUARIO" autocomplete="username">
            <input type="password" id="passInput" placeholder="CONTRASEÑA" autocomplete="current-password">
            <button class="btn-login" onclick="checkLogin()">ACCEDER</button>
            <p id="errorMsg" style="color: red; font-size: 12px; margin-top: 10px; display: none;">DATOS INCORRECTOS</p>
        </div>
    </div>

    <div id="main-content">
        <div id="btn-refresh" onclick="refreshData()" title="Actualizar Datos">🔄</div>

        <div id="panel">
            <div class="handle" onclick="togglePanel()"></div>
            <h3>MONITOR HAF</h3>
            <div id="lista-dispositivos">Esperando señal...</div>
            
            <div id="seccion-historial" style="display:none; border-top: 1px solid #333; margin-top: 15px; padding-top: 10px;">
                <small style="color:#888">HISTORIAL DE: <b id="nombre-sel" style="color:#0f0"></b></small>
                <input type="date" id="inputFecha">
                <button class="btn-historial" onclick="verHistorial()">Consultar Historial</button>
                <button class="btn-vivo" onclick="regresarAlVivo()">Regresar al Vivo</button>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        // Función de Login
        function checkLogin() {
            const user = document.getElementById("userInput").value;
            const pass = document.getElementById("passInput").value;
            if (user === "HAF" && pass === "189600") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                setTimeout(() => { initMap(); }, 150);
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        }

        // Función para actualizar datos sin recargar página
        function refreshData() {
            if (map) {
                // Centrar mapa en Mendoza por defecto si no hay selección
                if (!dispositivoSeleccionado) {
                    map.setZoom(14);
                    map.panTo({lat: -32.889, lng: -68.845});
                }
                // Forzar lectura de Firebase (on('value') ya es automático, pero esto asegura la UI)
                console.log("HAF Monitor: Sincronizando dispositivos...");
                // Cerramos infoWindow si está abierta
                if (infoWindow) infoWindow.close();
            }
        }

        function togglePanel() {
            document.getElementById("panel").classList.toggle("minimized");
        }

        // Firebase Setup
        const _0xHAF = atob("QUl6YVN5RFV4b19VbDY1VVlMTklrbEt0UmhaX1VuVVM5a29BUjBZ");
        const firebaseConfig = { databaseURL: "https://tracker-rastreador-haf-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let map, infoWindow;
        let markers = {}; 
        let deviceData = {};
        let dispositivoSeleccionado = null;
        let polylineHistorial = null;
        let historialRef = null; 
        let zIndexGlobal = 1000;

        const paletaColores = ["#D32F2F", "#1976D2", "#FBC02D", "#5D4037", "#212121", "#455A64", "#388E3C", "#E64A19"];

        (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?(console.warn(p+" only loads once. Re-queueing:",g),d[l](f,...n)):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({ key: _0xHAF, v: "weekly" });

        async function initMap() {
            const { Map, InfoWindow } = await google.maps.importLibrary("maps");
            const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

            map = new Map(document.getElementById("map"), {
                zoom: 14, center: {lat: -32.889, lng: -68.845}, mapId: "4504f8b37365c3d0",
                disableDefaultUI: true, zoomControl: true
            });
            infoWindow = new InfoWindow();

            database.ref("dispositivos").on('value', (snapshot) => {
                const listaDiv = document.getElementById("lista-dispositivos");
                if (!listaDiv) return;
                listaDiv.innerHTML = ""; 

                let indice = 0;
                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const fullVal = childSnapshot.val();
                    if (!fullVal || !fullVal.actual) return;

                    const data = fullVal.actual;
                    deviceData[id] = data;
                    const pos = { lat: parseFloat(data.latitud), lng: parseFloat(data.longitud) };
                    let colorActual = paletaColores[indice % paletaColores.length];

                    if (!markers[id]) {
                        const icon = document.createElement("div");
                        icon.style.width = "0"; icon.style.height = "0";
                        icon.style.borderLeft = "14px solid transparent";
                        icon.style.borderRight = "14px solid transparent";
                        icon.style.borderBottom = `30px solid ${colorActual}`;
                        icon.style.filter = "drop-shadow(0 0 3px white)";
                        
                        markers[id] = new AdvancedMarkerElement({ 
                            map: map, position: pos, content: icon, title: id, 
                            zIndex: 1000 + indice, gmpClickable: true 
                        });
                        markers[id].addEventListener("gmp-click", () => { abrirInfo(id); });
                    } else {
                        markers[id].position = pos;
                    }

                    const nombreLimpio = id.split("__")[0].replace(/_/g, " ");
                    
                    let estadoRed = "🟢 Red Estable";
                    let colorRed = "#0f0";
                    if (data.hora) {
                        try {
                            const [h, m, s] = data.hora.split(":");
                            const hRep = new Date();
                            hRep.setHours(h, m, s, 0);
                            const df = (new Date() - hRep) / 1000;
                            if (df > 60 || df < -60) {
                                estadoRed = "🔴 Vehículo Sin Internet (Offline)";
                                colorRed = "#f00";
                            }
                        } catch(e){}
                    }

                    const estadoGps = data.status || "Esperando diagnóstico...";

                    listaDiv.innerHTML += `
                        <div id="card-${id}" class="dispositivo-card ${dispositivoSeleccionado === id ? 'selected' : ''}" onclick="seleccionar('${id}')">
                            <b style="color:${colorActual}">${nombreLimpio}</b><br>
                            🔋 ${data.bateria || "N/A"} | ⏰ ${data.hora || "--:--"}
                            <div style="margin-top:8px; padding-top:8px; border-top:1px dashed #333;">
                                <small style="color:${colorRed}; display:block;">📶 ${estadoRed}</small>
                                <small style="color:#aaa; display:block;">🛰️ ${estadoGps}</small>
                            </div>
                        </div>`;
                    
                    indice++;
                });
            });
        }

        function abrirInfo(id) {
            const data = deviceData[id];
            if (!data) return;
            const content = `<div style="color:#333; padding:10px; font-family:Arial; font-size:13px;">
                <b style="color:#1A73E8; font-size:15px;">🛰️ ${id}</b><hr>
                <b>🔋 Batería:</b> ${data.bateria || 'N/A'}<br>
                <b>⏰ Reporte:</b> ${data.hora || '--:--'}<br>
                <b>📡 GPS:</b> ${data.status || 'N/A'}
            </div>`;
            infoWindow.setContent(content);
            infoWindow.open(map, markers[id]);
            zIndexGlobal++; markers[id].zIndex = zIndexGlobal;
        }

        function seleccionar(id) {
            dispositivoSeleccionado = id;
            document.getElementById("nombre-sel").innerText = id;
            document.getElementById("seccion-historial").style.display = "block";
            document.getElementById("panel").classList.remove("minimized");
            if(markers[id]) {
                map.panTo(markers[id].position);
                map.setZoom(17);
                abrirInfo(id);
            }
        }

        async function verHistorial() {
            const fecha = document.getElementById("inputFecha").value;
            if(!fecha || !dispositivoSeleccionado) return alert("Seleccioná una fecha");
            if(historialRef) historialRef.off();
            if(polylineHistorial) polylineHistorial.setMap(null);
            
            polylineHistorial = new google.maps.Polyline({ path: [], map: map, strokeColor: '#F00', strokeWeight: 5 });
            historialRef = database.ref(`dispositivos/${dispositivoSeleccionado}/historial/${fecha}`);
            historialRef.on('value', snap => {
                if(!snap.exists()) return alert("Sin datos");
                let puntos = [];
                snap.forEach(h => { 
                    const p = h.val(); 
                    if(p && p.latitud && p.longitud) puntos.push({lat: parseFloat(p.latitud), lng: parseFloat(p.longitud)});
                });
                if(puntos.length > 0) {
                    polylineHistorial.setPath(puntos);
                    const bounds = new google.maps.LatLngBounds();
                    puntos.forEach(p => bounds.extend(p));
                    map.fitBounds(bounds);
                }
            });
            togglePanel();
        }

        function regresarAlVivo() {
            if(historialRef) { historialRef.off(); historialRef = null; }
            document.getElementById("seccion-historial").style.display = "none";
            if (polylineHistorial) { polylineHistorial.setMap(null); polylineHistorial = null; }
            dispositivoSeleccionado = null;
            if (infoWindow) infoWindow.close();
            map.setZoom(14);
            document.getElementById("panel").classList.remove("minimized");
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registrado'))
                    .catch(err => console.error('Error al registrar SW', err));
            });
        }
    </script>
</body>
</html>
