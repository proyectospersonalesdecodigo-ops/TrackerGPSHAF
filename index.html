<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HAF Monitor Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/684/684908.png">

    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>
    
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; width: 100vw; position: fixed; }
        
        /* PANTALLA DE LOGIN */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .login-box {
            background: rgba(0, 20, 0, 0.95); padding: 30px;
            border: 2px solid #0f0; border-radius: 15px;
            box-shadow: 0 0 20px #0f0; text-align: center; width: 280px;
        }
        .login-box h2 { margin-bottom: 20px; text-shadow: 0 0 5px #0f0; }
        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #111; border: 1px solid #0f0; color: #fff;
            border-radius: 5px; box-sizing: border-box; outline: none;
        }
        .btn-login {
            width: 100%; padding: 12px; background: #0f0; color: #000;
            border: none; border-radius: 5px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; margin-top: 10px;
        }

        /* CONTENIDO PRINCIPAL */
        #main-content { display: none; width: 100%; height: 100%; }
        #map { height: 100vh; width: 100%; position: absolute; top: 0; left: 0; }
        
        #panel { 
            position: fixed; top: 15px; left: 15px; z-index: 1000; 
            background: rgba(0, 0, 0, 0.92); padding: 20px; 
            border: 1px solid #0f0; border-radius: 12px; 
            width: 280px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.4);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #btn-refresh {
            position: fixed; top: 15px; right: 15px; z-index: 1001;
            background: rgba(0, 0, 0, 0.8); color: #0f0;
            border: 1px solid #0f0; border-radius: 50%;
            width: 45px; height: 45px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            font-size: 20px; transition: 0.3s;
        }
        #btn-refresh:active { transform: scale(0.9) rotate(90deg); }

        .handle {
            width: 50px; height: 6px; background: #0f0; border-radius: 3px;
            margin: -5px auto 15px auto; cursor: pointer; display: none;
            box-shadow: 0 0 8px #0f0;
        }

        @media (max-width: 600px) {
            #panel {
                top: auto; bottom: 0; left: 0; width: 100%; 
                max-height: 55vh; border-radius: 20px 20px 0 0;
                padding: 15px; border: 1px solid #0f0; border-bottom: none;
                box-sizing: border-box; padding-bottom: 30px;
            }
            .handle { display: block; }
            #panel.minimized { transform: translateY(calc(100% - 60px)); }
            #lista-dispositivos { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; }
            .dispositivo-card { min-width: 190px; margin-bottom: 0 !important; flex-shrink: 0; }
        }

        .dispositivo-card {
            background: #f0f0f0; border: 1px solid #333;
            padding: 12px; margin-bottom: 10px; border-radius: 8px;
            font-size: 13px; cursor: pointer; transition: 0.3s;
            color: #000;
        }
        .dispositivo-card.selected { border: 2px solid #0f0; background: #fff; }
        
        h3 { margin: 0 0 15px 0; text-align: center; color: #0f0; text-shadow: 0 0 5px #0f0; font-size: 18px; }
        
        /* ESTILOS DE TRIÁNGULOS TÁCTICOS */
        .net-tactical { display: flex; align-items: center; justify-content: space-around; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #999; }
        .tri-indicator { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .tri-label { font-size: 8px; text-transform: uppercase; color: #777; font-weight: bold; }
        
        .tri-wifi { color: #00d4ff; font-size: 20px; line-height: 1; }   /* ▲ Cian Grande */
        .tri-antena { color: #ffaa00; font-size: 15px; line-height: 1; } /* ◣ Naranja Mediano */
        .tri-datos { color: #00ff66; font-size: 11px; line-height: 1; }  /* ▼ Verde Chico */
        
        .tri-off { color: #bbb !important; opacity: 0.4; }
        .tri-val { font-size: 9px; font-weight: bold; color: #333; }

        input[type="date"], input[type="time"] { 
            width: 100%; background: #222; color: #fff; border: 1px solid #444; 
            padding: 8px; border-radius: 6px; box-sizing: border-box; outline: none; font-family: inherit;
        }

        button { width: 100%; padding: 12px; margin-top: 5px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; text-transform: uppercase; }
        .btn-historial { background: #0f0; color: #000; }
        .btn-vivo { background: #333; color: #fff; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>HAF SECURITY</h2>
            <input type="text" id="userInput" placeholder="USUARIO" autocomplete="username">
            <input type="password" id="passInput" placeholder="CONTRASEÑA" autocomplete="current-password">
            <button class="btn-login" onclick="checkLogin()">ACCEDER</button>
            <p id="errorMsg" style="color: red; font-size: 12px; margin-top: 10px; display: none;">DATOS INCORRECTOS</p>
        </div>
    </div>

    <div id="main-content">
        <div id="btn-refresh" onclick="refreshUI()" title="Sincronizar Datos">🔄</div>
        <div id="panel">
            <div class="handle" onclick="togglePanel()"></div>
            <h3>MONITOR HAF</h3>
            <div id="lista-dispositivos">Esperando señal...</div>
            
            <div id="seccion-historial" style="display:none; border-top: 1px solid #333; margin-top: 15px; padding-top: 10px;">
                <small style="color:#000">DISPOSITIVO: <b id="nombre-sel" style="color:#000"></b></small>
                
                <div class="historial-controls">
                    <label style="font-size: 10px; color: #888;">FECHA:</label>
                    <input type="date" id="inputFecha">
                    
                    <div class="time-row">
                        <div>
                            <label>Desde:</label>
                            <input type="time" id="horaInicio" value="00:00">
                        </div>
                        <div>
                            <label>Hasta:</label>
                            <input type="time" id="horaFin" value="23:59">
                        </div>
                    </div>
                </div>

                <button class="btn-historial" onclick="verHistorial()">Consultar Historial</button>
                <button class="btn-vivo" onclick="regresarAlVivo()">Regresar al Vivo</button>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        function checkLogin() {
            const user = document.getElementById("userInput").value;
            const pass = document.getElementById("passInput").value;
            if (user === "HAF" && pass === "189600") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                loadGoogleMaps();
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        }

        function togglePanel() {
            document.getElementById("panel").classList.toggle("minimized");
        }

        const _0xHAF = atob("QUl6YVN5RFV4b19VbDY1VVlMTklrbEt0UmhaX1VuVVM5a29BUjBZ");
        const firebaseConfig = { databaseURL: "https://tracker-rastreador-haf-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let map, infoWindow;
        let markers = {}; 
        let deviceData = {};
        let dispositivoSeleccionado = null;
        const paletaColores = ["#D32F2F", "#1976D2", "#FBC02D", "#5D4037", "#388E3C", "#E64A19"];

        function loadGoogleMaps() {
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${_0xHAF}&callback=initApp`;
            document.head.appendChild(script);
        }

        window.initApp = function() {
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 14, center: {lat: -32.889, lng: -68.845},
                disableDefaultUI: false, zoomControl: true, mapTypeId: 'roadmap'
            });
            infoWindow = new google.maps.InfoWindow();
            startTracking();
        };

        function refreshUI() {
            for (let id in markers) { markers[id].setMap(null); }
            markers = {};
            startTracking();
            if (infoWindow) infoWindow.close();
        }

        function startTracking() {
            database.ref("dispositivos").on('value', (snapshot) => {
                const listaDiv = document.getElementById("lista-dispositivos");
                if (!listaDiv) return;
                listaDiv.innerHTML = ""; 

                let indice = 0;
                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const fullVal = childSnapshot.val();
                    if (!fullVal || !fullVal.actual) return;

                    const data = fullVal.actual;
                    deviceData[id] = data;
                    const pos = { lat: parseFloat(data.latitud || 0), lng: parseFloat(data.longitud || 0) };
                    let colorActual = paletaColores[indice % paletaColores.length];

                    if (!markers[id]) {
                        markers[id] = new google.maps.Marker({ 
                            map: map, position: pos, title: id,
                            icon: {
                                path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                                scale: 6, fillColor: colorActual, fillOpacity: 0.9,
                                strokeColor: "#fff", strokeWeight: 2
                            }
                        });
                        markers[id].addListener("click", () => seleccionar(id));
                    } else { markers[id].setPosition(pos); }

                    const nombreLimpio = String(id).split("__")[0].replace(/_/g, " ");
                    const batDisplay = data.bateria || "---";
                    const isCharging = data.is_charging === "SI" ? "⚡" : "";
                    const horaDisplay = data.hora || "---";
                    
                    // LÓGICA DE TRIÁNGULOS TÁCTICOS CON SSID
const nWifi = data.net_wifi === "ON";
const nSsid = data.net_ssid || "Wi-Fi"; // <--- Capturamos el nombre
const nWifiPct = data.wifi_pct || "0%";
const nAntenaPct = data.antena_pct || "0%";
const nDatosOk = data.net_datos === "ON";
listaDiv.innerHTML += `
    <div id="card-${id}" class="dispositivo-card ${dispositivoSeleccionado === id ? 'selected' : ''}" onclick="seleccionar('${id}')">
        <b style="color:${colorActual}">${nombreLimpio}</b> | 🔋 ${batDisplay}${isCharging} | ⏰ ${horaDisplay}
        
        <div class="net-tactical">
            <!-- TRIANGULO WIFI + SSID -->
            <div class="tri-indicator" style="width: 33%">
                <span class="tri-wifi ${!nWifi ? 'tri-off' : ''}">▲</span>
                <span class="tri-label">${nWifi ? nSsid : 'Wifi'}</span> <!-- Muestra el nombre aquí -->
                <span class="tri-val">${nWifi ? nWifiPct : 'OFF'}</span>
            </div>
            
            <!-- ANTENA (RAYITAS REALES DEL CHIP) -->
            <div class="tri-indicator" style="width: 33%">
                <span class="tri-antena">◣</span>
                <span class="tri-label">Antena</span>
                <span class="tri-val">${nAntenaPct}</span>
            </div>
            
            <!-- DATOS (INTERNET MÓVIL) -->
            <div class="tri-indicator" style="width: 33%">
                <span class="tri-datos ${!nDatosOk ? 'tri-off' : ''}">▼</span>
                <span class="tri-label">Datos</span>
                <span class="tri-val">${nDatosOk ? 'OK' : 'OFF'}</span>
            </div>
        </div>
    </div>`;
                    indice++;
                });
            });
        }

        function seleccionar(id) {
            dispositivoSeleccionado = id;
            document.getElementById("nombre-sel").innerText = id;
            document.getElementById("seccion-historial").style.display = "block";
            const data = deviceData[id];
            if(markers[id]) {
                map.panTo(markers[id].getPosition());
                map.setZoom(17);
                const bat = data.bateria || "---";
                const diag = data.net_wifi === "ON" ? "Wi-Fi" : "Datos Móviles";
                infoWindow.setContent(`<div style="color:#000"><b>${id}</b><br>Batería: ${bat}${data.is_charging === "SI" ? "⚡" : ""}<br>Internet: ${diag}</div>`);
                infoWindow.open(map, markers[id]);
            }
        }

        let polylineHistorial = null;
        let historialRef = null;

        async function verHistorial() {
            const fecha = document.getElementById("inputFecha").value;
            const hInicio = document.getElementById("horaInicio").value;
            const hFin = document.getElementById("horaFin").value;
            if(!fecha || !dispositivoSeleccionado) return alert("Seleccioná una fecha y un dispositivo");
            if(historialRef) historialRef.off();
            if(polylineHistorial) polylineHistorial.setMap(null);
            polylineHistorial = new google.maps.Polyline({
                path: [], map: map, strokeColor: '#FF0000', strokeOpacity: 1.0, strokeWeight: 4,
                icons: [{ icon: { path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW }, offset: '100%', repeat: '50px' }]
            });
            const minInicio = (parseInt(hInicio.split(":")[0]) * 60) + parseInt(hInicio.split(":")[1]);
            const minFin = (parseInt(hFin.split(":")[0]) * 60) + parseInt(hFin.split(":")[1]);
            historialRef = database.ref(`dispositivos/${dispositivoSeleccionado}/historial/${fecha}`);
            historialRef.on('value', snap => {
                if(!snap.exists()) return alert("No hay datos de historial para esta fecha.");
                let puntos = [];
                const bounds = new google.maps.LatLngBounds();
                snap.forEach(h => { 
                    const p = h.val(); 
                    if(p && p.latitud && p.longitud && p.hora) {
                        const hPartes = p.hora.split(":");
                        const minReporte = (parseInt(hPartes[0]) * 60) + parseInt(hPartes[1]);
                        if(minReporte >= minInicio && minReporte <= minFin) {
                            const coord = {lat: parseFloat(p.latitud), lng: parseFloat(p.longitud)};
                            puntos.push(coord);
                            bounds.extend(coord);
                        }
                    }
                });
                if(puntos.length > 0) {
                    polylineHistorial.setPath(puntos);
                    map.fitBounds(bounds);
                } else { alert("No hay registros en ese rango horario."); }
            });
        }

        function regresarAlVivo() {
            if(historialRef) { historialRef.off(); historialRef = null; }
            if (polylineHistorial) { polylineHistorial.setMap(null); polylineHistorial = null; }
            document.getElementById("seccion-historial").style.display = "none";
            dispositivoSeleccionado = null;
            map.setZoom(14);
            map.panTo({lat: -32.889, lng: -68.845});
            if (infoWindow) infoWindow.close();
        }
    </script>
</body>
</html>
